<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магічний курс «Математика» — 9 клас НУШ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(26, 26, 46, 0.85);
            --gold: #ffd700;
            --neon-blue: #00f3ff;
            --neon-purple: #b026ff;
            --neon-pink: #ff007f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1a1a3a 0%, #080711 100%);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 60px;
        }

        /* Мерехтливі зорі */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, var(--neon-blue), rgba(0,0,0,0)),
                        radial-gradient(1px 1px at 90px 40px, var(--neon-pink), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.4;
            z-index: 0;
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(10, 10, 25, 0.85);
            border-bottom: 2px solid var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
            position: relative;
            z-index: 2;
            perspective: 1000px;
        }

        .header-left, .header-right {
            flex: 0 0 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 800px;
        }

        .header-left img {
            max-width: 150px;
            max-height: 110px;
            object-fit: contain;
            transform: rotateY(25deg) rotateX(12deg) rotateZ(-6deg) translateZ(20px);
            transform-style: preserve-3d;
            filter: 
                drop-shadow(-8px 10px 12px rgba(0, 0, 0, 0.8))
                drop-shadow(0 0 15px rgba(0, 243, 255, 0.7))
                contrast(1.15) brightness(1.1);
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .header-left img:hover {
            transform: rotateY(10deg) rotateX(5deg) scale(1.1) translateZ(30px);
            filter: 
                drop-shadow(-12px 14px 18px rgba(0, 0, 0, 0.9))
                drop-shadow(0 0 25px var(--gold));
        }

        .header-right img {
            max-width: 150px;
            max-height: 110px;
            object-fit: contain;
            transform: rotateY(-25deg) rotateX(12deg) rotateZ(6deg) translateZ(20px);
            transform-style: preserve-3d;
            filter: 
                drop-shadow(8px 10px 12px rgba(0, 0, 0, 0.8))
                drop-shadow(0 0 15px rgba(176, 38, 255, 0.7))
                contrast(1.15) brightness(1.1);
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .header-right img:hover {
            transform: rotateY(-10deg) rotateX(5deg) scale(1.1) translateZ(30px);
            filter: 
                drop-shadow(12px 14px 18px rgba(0, 0, 0, 0.9))
                drop-shadow(0 0 25px var(--gold));
        }

        .header-center {
            flex: 1;
            text-align: center;
        }

        .header-center h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.8rem;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #ffe600 50%, #ff007f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 1.2px #080711;
            text-shadow: 
                0 1px 0 #cccccc,
                0 2px 0 #b9b9b9,
                0 3px 0 #aaa,
                0 4px 1px rgba(0,0,0,0.5),
                0 0 4px var(--gold),
                0 0 10px rgba(255, 0, 127, 0.6),
                0 0 18px rgba(176, 38, 255, 0.5);
            animation: neonPulse 2.5s infinite alternate ease-in-out;
        }

        @keyframes neonPulse {
            0% { filter: drop-shadow(0 0 3px var(--gold)) drop-shadow(0 0 8px rgba(255, 0, 127, 0.7)); }
            100% { filter: drop-shadow(0 0 8px var(--neon-blue)) drop-shadow(0 0 14px rgba(176, 38, 255, 0.7)); }
        }

        /* Головний контейнер */
        .main-container {
            max-width: 1350px;
            margin: 30px auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        /* Верхній центральний блок навігації */
        .top-nav-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .nav-card {
            background: var(--card-bg);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .nav-card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: var(--gold);
            box-shadow: 0 0 25px var(--gold), 0 0 40px var(--neon-purple);
        }

        /* Стилі для заблокованих поверхів */
        .nav-card.locked {
            border-color: rgba(255, 0, 127, 0.4);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
            opacity: 0.85;
        }

        .nav-card.locked:hover {
            transform: translateY(-3px) scale(1.01);
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
            cursor: not-allowed;
        }

        .lock-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(10, 10, 25, 0.85);
            border: 2px solid var(--neon-pink);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 0 10px var(--neon-pink);
            z-index: 5;
            animation: lockGlow 2s infinite alternate;
        }

        @keyframes lockGlow {
            0% { box-shadow: 0 0 8px var(--neon-pink); }
            100% { box-shadow: 0 0 15px var(--gold); }
        }

        .nav-card.map-card {
            border-color: var(--gold);
            flex: 1 1 500px;
            min-width: 340px;
            max-width: 700px;
            padding: 20px 25px;
        }

        .nav-card.map-card .door-img-wrapper {
            width: 100%;
            height: 280px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .door-img-wrapper {
            position: relative;
            width: 170px;
            height: 220px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
            border: 2px solid rgba(255,255,255,0.15);
        }

        .door-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .nav-card:hover .door-img {
            transform: scale(1.05);
        }

        .avatar-icon {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            box-shadow: 0 0 12px var(--gold);
            object-fit: cover;
            background: #000;
        }

        .door-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 8px var(--neon-blue), 0 0 15px var(--neon-blue);
            letter-spacing: 0.5px;
        }

        /* Магічний капелюх */
        .magic-hat-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            padding: 10px;
        }

        .magic-hat-img {
            width: 160px;
            height: auto;
            max-height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px var(--neon-purple)) drop-shadow(0 0 30px var(--neon-pink));
            animation: float 4s ease-in-out infinite, magicGlow 3s infinite alternate;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .magic-hat-wrapper:hover .magic-hat-img {
            transform: scale(1.1) rotate(3deg);
            filter: drop-shadow(0 0 25px var(--gold)) drop-shadow(0 0 45px var(--neon-blue));
        }

        .hat-title {
            margin-top: 15px;
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.25rem;
            color: var(--gold);
            text-shadow: 0 0 10px var(--gold), 0 0 20px var(--neon-pink);
            font-weight: bold;
            text-align: center;
        }

        /* Секція поверхів */
        .floors-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 50px;
        }

        .floors-grid .door-img-wrapper {
            width: 150px;
            height: 190px;
        }

        .floors-grid .door-title {
            font-size: 1.2rem;
            margin-top: 5px;
        }

        .wisdom-btn {
            display: block;
            margin: 0 auto;
            padding: 12px 30px;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
            border: none;
            border-radius: 25px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-pink);
            transition: all 0.3s ease;
        }

        .wisdom-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--gold);
        }

        /* Панель Поверху / Список Уроків */
        .floor-detail-panel {
            display: none;
            background: rgba(15, 15, 35, 0.95);
            border: 2px solid var(--neon-purple);
            border-radius: 20px;
            padding: 30px;
            margin-top: 20px;
            box-shadow: 0 0 30px var(--neon-purple);
        }

        .floor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 15px;
        }

        .floor-header h2 {
            font-family: 'Cinzel Decorative', serif;
            color: var(--gold);
            font-size: 1.8rem;
            text-shadow: 0 0 10px var(--gold);
        }

        .back-btn {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: 12px;
            color: white;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-blue);
            transition: transform 0.2s;
        }

        .back-btn:hover {
            transform: scale(1.05);
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .lesson-card {
            background: rgba(30, 30, 60, 0.8);
            border: 1px solid var(--neon-blue);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            transition: transform 0.3s, border-color 0.3s;
        }

        .lesson-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 0 15px var(--gold);
        }

        .lesson-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            margin-bottom: 12px;
            object-fit: cover;
            box-shadow: 0 0 10px var(--gold);
        }

        .lesson-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            flex-grow: 1;
            color: #ffffff;
            line-height: 1.4;
        }

        .lesson-btn {
            display: inline-block;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
            width: 100%;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }

        .btn-spell {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
        }

        .btn-test {
            background: linear-gradient(45deg, #f7971e, #ffd200);
            color: #000;
            box-shadow: 0 0 10px rgba(255, 210, 0, 0.5);
        }

        .btn-exam {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .btn-diagnostic {
            background: linear-gradient(45deg, #00b09b, #96c93d);
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 176, 155, 0.5);
        }

        .lesson-btn:hover {
            filter: brightness(1.2);
            transform: scale(1.02);
        }

        /* Модальні вікна */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 15, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 20px;
            width: 90%;
            max-width: 650px;
            padding: 35px 30px;
            position: relative;
            box-shadow: 0 0 35px var(--gold), 0 0 20px var(--neon-purple);
            color: #fff;
            text-align: center;
        }

        .modal-fullscreen {
            width: 95%;
            height: 92%;
            max-width: none;
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2.2rem;
            color: var(--neon-pink);
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: var(--gold);
        }

        .modal-iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            margin-top: 15px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-14px); }
        }

        @keyframes magicGlow {
            0% { filter: drop-shadow(0 0 15px var(--neon-purple)) drop-shadow(0 0 25px var(--neon-pink)); }
            100% { filter: drop-shadow(0 0 25px var(--neon-blue)) drop-shadow(0 0 35px var(--gold)); }
        }

        @media (max-width: 900px) {
            .header-center h1 { font-size: 2rem; }
            .top-nav-section { flex-direction: column; gap: 30px; align-items: center; }
            .floors-grid { grid-template-columns: repeat(2, 1fr); }
            .nav-card.map-card { max-width: 100%; width: 100%; }
        }
        @media (max-width: 550px) {
            .header-center h1 { font-size: 1.5rem; }
            .floors-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 15px; text-align: center; }
            .header-left img, .header-right img { transform: none; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <header>
        <div class="header-left">
            <img src="https://lh3.googleusercontent.com/d/19BBlV-3eZ3u0ArUrPs7bR2vswNMNtX56" alt="Логотип ліворуч">
        </div>
        <div class="header-center">
            <h1>Магічний курс «Математика»</h1>
        </div>
        <div class="header-right">
            <img src="https://lh3.googleusercontent.com/d/1ZKTVjhhyHTDBZE-e051mRCU6raYdeXsf" alt="Логотип праворуч">
        </div>
    </header>

    <div class="main-container">

        <div class="top-nav-section">
            <div class="magic-hat-wrapper" onclick="getPrediction()">
                <img src="https://lh3.googleusercontent.com/d/1A30praTggIejJwt6ruigAYfEHPEgVhBc" alt="Магічний капелюх передбачень" class="magic-hat-img">
                <div class="hat-title">✨ Отримай своє передбачення</div>
            </div>

            <div class="nav-card map-card" onclick="openMapModal()">
                <div class="door-img-wrapper">
                    <img src="https://lh3.googleusercontent.com/d/1YYg7a_FIX431_e5ICyELxXMGe16F6B4N" alt="Карта предмета" class="door-img">
                </div>
                <div class="door-title" style="color: var(--gold); text-shadow: 0 0 8px var(--gold);">🗺️ Карта предмета</div>
            </div>
        </div>

        

        <div class="floor-detail-panel" id="floorDetailPanel">
            <div class="floor-header">
                <h2 id="floorTitle">Надолуження освітніх втрат</h2>
            </div>
            <div class="lessons-grid" id="lessonsGrid"></div>
        </div>

    </div>

    <div class="modal" id="mapModal">
        <div class="modal-content modal-fullscreen">
            <span class="close-btn" onclick="closeMapModal()">×</span>
            <h2 style="font-family: 'Cinzel Decorative'; color: var(--gold); text-align: center;">🏛️ Карта предмета</h2>
            <iframe class="modal-iframe" src="https://drive.google.com/file/d/19oJ0630-SaF_b2gt8AX_yMvOhVGcYRNl/preview"></iframe>
        </div>
    </div>

    <div class="modal" id="predictionModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePredictionModal()">×</span>
            <h2 style="font-family: 'Cinzel Decorative'; color: var(--gold); margin-bottom: 20px; font-size: 1.8rem; text-shadow: 0 0 10px var(--gold);">🔮 Магічне Передбачення</h2>
            <p id="prediction-text" style="font-size: 1.25rem; line-height: 1.6; color: #ffffff; text-shadow: 0 0 8px var(--neon-blue); margin-bottom: 25px; padding: 0 10px;"></p>
            <button onclick="getPrediction()" class="wisdom-btn" style="margin-top: 10px;">✨ Отримати ще одне передбачення</button>
        </div>
    </div>

    <script>
        const predictions = [
            "Сьогодні ідеальний день, щоб розібратися з найскладнішою задачею!",
            "Твоя допитливість — це твоя головна магічна сила. Розкривай її!",
            "Кожна помилка сьогодні — це крок до великого відкриття завтра.",
            "На тебе чекає раптове осягнення нової теми. Усе вдастся!",
            "Математика любить наполегливих. Повір у свої сили!",
            "Сьогодні ти розв'яжеш задачу швидше, ніж очікуєш.",
            "Твій мозок сьогодні працює на максимум — скористайся цим!",
            "Навчання — це суперсила, яка залишається з тобою назавжди.",
            "Сьогодні правильна відповідь знайде тебе сама, якщо ти трохи постараєшся.",
            "Не бійся складних прикладів, вони лише роблять тебе сильним!",
            "Твоя уважність сьогодні на найвищому рівні.",
            "Сьогодні ти дізнаєшся щось таке, що здивує твоїх друзів.",
            "Магія знань уже працює на тебе. Просто зроби перший крок!",
            "Успіх складається з маленьких щоденних кроків. Ти на правильному шляху!",
            "Навіть найдовший шлях починається з першого розв'язаного рівняння.",
            "Сьогодні ти знайдеш відповідь на питання, яке давно тебе цікавило.",
            "Твій потенціал безмежний. Не зупиняйся на досягнутому!",
            "Сьогоднішній урок принесе тобі справжнє задоволення від результату.",
            "Ти здатний зрозуміти навіть найскладнішу формулу — дай собі час.",
            "Натхнення вже поруч, просто розгорни зошит або підручник!",
            "Твоя праця обов'язково перетвориться на високі бали.",
            "Сьогодні ти станеш на один крок ближче до своєї мрії.",
            "Логіка — це твоя чарівна паличка на сьогоднішньому уроці.",
            "Спробуй подивитися на задачу під іншим кутом, і рішення з'явиться!",
            "Вір у свої здібності — ти знаєш набагато більше, ніж тобі здається.",
            "Сьогодні чудовий день для командної роботи та нових ідей.",

        function openFloor(floorNum) {
            // Захист від відкриття поверхів від 2 до останнього (6)
            if (floorNum > 1) {
                showLockedMessage(floorNum);
                return;
            }

            const data = floorsData[floorNum];
            if(!data) return;

            document.getElementById('floorTitle').innerText = data.title;
            
            const lessonsGrid = document.getElementById('lessonsGrid');
            lessonsGrid.innerHTML = '';

            data.lessons.forEach(lesson => {
                const lessonName = typeof lesson === 'string' ? lesson : lesson.name;
                const lessonUrl = typeof lesson === 'object' && lesson.url ? lesson.url : '#';
                
                let btnText = "Вивчити закляття";
                let btnClass = "btn-spell";

                const lower = lessonName.toLowerCase();
                if(lower.includes("діагностувальне опитування")) {
                    btnText = "Зняти чари забуття";
                    btnClass = "btn-diagnostic";
                } else if(lower.includes("самостійна робота")) {
                    btnText = "Пройти випробування";
                    btnClass = "btn-test";
                } else if(lower.includes("контрольна робота")) {
                    btnText = "Скласти магічний залік";
                    btnClass = "btn-exam";
                }

                const card = document.createElement('div');
                card.className = 'lesson-card';
                card.innerHTML = `
                    <img src="${data.avatar}" alt="Аватар" class="lesson-avatar">
                    <div class="lesson-title">${lessonName}</div>
                    <a href="${lessonUrl}" ${lessonUrl !== '#' ? 'target="_blank"' : ''} class="lesson-btn ${btnClass}">${btnText}</a>
                `;
                lessonsGrid.appendChild(card);
            });

            document.getElementById('floorDetailPanel').style.display = 'block';
        }

        // Одразу показуємо всі уроки розділу «Надолуження освітніх втрат».
        window.addEventListener('DOMContentLoaded', () => openFloor(1));

        function showLockedMessage(floorNum) {
            const floorNames = {
                2: "Поверх 2. Координати на площині",
                3: "Поверх 3. Нерівності",
                4: "Поверх 4. Вектори на площині",
                5: "Поверх 5. Квадратична функція",
                6: "Поверх 6. Розв'язування трикутників"
            };
            
            document.getElementById('prediction-text').innerText = `🔒 Цей поверх (${floorNames[floorNum] || 'Поверх ' + floorNum}) наразі заблокований магічними чарами! Перехід до нього суворо заборонено. Спочатку опануйте попередні знання!`;
            document.getElementById('predictionModal').style.display = 'flex';
        }

        function getPrediction() {
            const randomIndex = Math.floor(Math.random() * predictions.length);
            document.getElementById('prediction-text').innerText = predictions[randomIndex];
            document.getElementById('predictionModal').style.display = 'flex';
        }

        function closePredictionModal() {
            document.getElementById('predictionModal').style.display = 'none';
        }

        function openMapModal() {
            document.getElementById('mapModal').style.display = 'flex';
        }
        function closeMapModal() {
            document.getElementById('mapModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const predModal = document.getElementById('predictionModal');
            const mapModal = document.getElementById('mapModal');
            if (event.target === predModal) {
                closePredictionModal();
            }
            if (event.target === mapModal) {
                closeMapModal();
            }
        };
